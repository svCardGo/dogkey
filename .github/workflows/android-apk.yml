name: Build DogKey Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply clean UI patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          # Prefer local inject scripts if present
          for name in ('scripts/inject_B.py', 'scripts/inject_C.py', 'scripts/inject_clean_screens.py'):
              p = Path(name)
              if p.exists():
                  import subprocess, sys
                  try:
                      subprocess.check_call([sys.executable, str(p)])
                  except Exception as e:
                      print('inject skip', name, e)
          # Strip any remaining dog imagery / emoji from screens
          for rel in ('src/screensA.tsx', 'src/screensB.tsx', 'src/screensC.tsx'):
              p = Path(rel)
              if not p.exists():
                  continue
              t = p.read_text()
              t = t.replace('\U0001f415', '')  # dog face
              t = t.replace('\U0001f436', '')  # dog face alt
              t = t.replace('🐕', '')
              t = t.replace("DogLogo", '/* DogLogo removed */')
              # Remove hero-dog blocks (non-greedy)
              t = re.sub(r'<div className="hero-dog-wrap[^>]*>[\s\S]*?</div>\s*', '', t, count=3)
              t = re.sub(r'<div className="dog-portrait-lg">[^<]*</div>', '', t)
              t = re.sub(r"<span style=\{\{ fontSize: 18 \}\}>[^<]*</span>", "<span style={{ fontSize: 16, fontWeight: 600, color: 'var(--green)' }}>U</span>", t, count=1)
              p.write_text(t)
              print('patched', rel)
          # Ensure index.css is the clean system (not empty cinematic imports only)
          idx = Path('src/index.css')
          if idx.exists() and 'soft green' not in idx.read_text().lower() and '--green:#2d9f6f' not in idx.read_text():
              print('WARNING: index.css may not be clean system')
          else:
              print('index.css ok')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets (Vite → dist/)
        run: npm run build

      - name: Verify dist/ exists
        run: |
          test -d dist && ls -la dist/ | head -20
          test -f dist/index.html

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Add Capacitor Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Capacitor sync
        run: npx cap sync android

      - name: Android camera permissions + debuggable false
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          if not p.exists():
              print("no manifest yet")
              raise SystemExit(0)
          t = p.read_text()
          t = t.replace('android:debuggable="true"', 'android:debuggable="false"')
          if "CAMERA" not in t:
              perms = '''    <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
          '''
              t = t.replace("<application", perms + "\n    <application", 1)
          p.write_text(t)
          print("manifest hardened")
          PY

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK (assembleDebug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK → DogKey-CLEAN.apk
        run: |
          set -e
          APK_PATH=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          echo "Located APK: $APK_PATH"
          test -f "$APK_PATH"
          mkdir -p artifacts
          cp "$APK_PATH" artifacts/DogKey-CLEAN.apk
          ls -lh artifacts/

      - name: Upload DogKey-CLEAN.apk
        uses: actions/upload-artifact@v4
        with:
          name: DogKey-CLEAN.apk
          path: artifacts/DogKey-CLEAN.apk
          retention-days: 30
          if-no-files-found: error
