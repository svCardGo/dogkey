name: Build DogKey Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply cinematic UI overlay
        run: |
          if [ -f scripts/assemble_inject.py ]; then
            python3 scripts/assemble_inject.py || true
          fi
          if [ -f scripts/inject_cinematic_ui.py ]; then
            python3 scripts/inject_cinematic_ui.py || true
          else
            echo "WARNING: cinematic inject not present — building with repo UI (already cinematic)"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets (Vite → dist/)
        run: npm run build

      - name: Verify dist/ exists
        run: |
          test -d dist && ls -la dist/ | head -20
          test -f dist/index.html

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Add Capacitor Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Capacitor sync
        run: npx cap sync android

      - name: Android camera permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          if not p.exists():
              print("no manifest yet")
              raise SystemExit(0)
          t = p.read_text()
          if "CAMERA" in t:
              print("permissions already present")
          else:
              perms = """    <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\" />
              <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />
          """
              t = t.replace("<application", perms + "\n    <application", 1)
              p.write_text(t)
              print("permissions injected")
          PY

      - name: Report debug keystore SHA-1
        run: |
          KEYSTORE="${HOME}/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            mkdir -p "${HOME}/.android"
            keytool -genkey -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" || true
          fi
          echo "Package: com.dogkey.app"
          keytool -list -v -keystore "$KEYSTORE" -alias androiddebugkey -storepass android -keypass android 2>/dev/null | grep -E "SHA1:|SHA-1:" || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK (assembleDebug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK → DogKey-debug-SUPREME-v2.apk
        run: |
          set -e
          APK_PATH=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          echo "Located APK: $APK_PATH"
          test -f "$APK_PATH"
          mkdir -p artifacts
          cp "$APK_PATH" artifacts/DogKey-debug-SUPREME-v2.apk
          ls -lh artifacts/

      - name: Upload DogKey-debug-SUPREME-v2.apk
        uses: actions/upload-artifact@v4
        with:
          name: DogKey-debug-SUPREME-v2.apk
          path: artifacts/DogKey-debug-SUPREME-v2.apk
          retention-days: 30
          if-no-files-found: error
