name: Build DogKey Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm DocBox UI on main
        run: |
          test -f src/docbox.css
          test -f src/screensB.tsx
          grep -n docbox-root src/screensB.tsx | head -3
          grep -n db-card src/docbox.css | head -3

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --legacy-peer-deps

      - run: npm run build

      - run: test -f dist/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Capacitor android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Permissions
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          if [ -f "$MAN" ] && ! grep -q CAMERA "$MAN"; then
            sed -i 's|<application|    <uses-permission android:name="android.permission.CAMERA" />\n    <application|' "$MAN"
          fi

      - name: assembleDebug
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          test -f "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/DogKey-DocBox-UI.apk
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: DogKey-DocBox-UI.apk
          path: artifacts/DogKey-DocBox-UI.apk
          retention-days: 30
