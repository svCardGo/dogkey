name: Restore original UI and Build APK

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  restore-and-build:
    name: Restore UI + APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore original screens from f24775
        run: |
          set -e
          GOOD=f24775f0699ac95e832bae10798ff62f9811ec9e
          git fetch origin "$GOOD" || true
          git checkout "$GOOD" -- src/screensA.tsx src/screensB.tsx src/main.tsx
          rm -f src/docbox.css src/screensB-home-patch.md
          git config user.name "dogkey-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Already original UI"
          else
            git commit -m "Restore original DogKey UI from $GOOD"
            git push origin HEAD:main
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Verify dist/
        run: test -f dist/index.html && ls -la dist/ | head -20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" || true

      - name: Add Capacitor Android if missing
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Capacitor sync
        run: npx cap sync android

      - name: Camera permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          if not p.exists():
              raise SystemExit(0)
          t = p.read_text()
          t = t.replace('android:debuggable="true"', 'android:debuggable="false"')
          if "CAMERA" not in t:
              perms = '''    <uses-permission android:name="android.permission.CAMERA" />
    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
    <uses-feature android:name="android.hardware.camera" android:required="false" />
'''
              t = t.replace("<application", perms + "\n    <application", 1)
          p.write_text(t)
          PY

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "APK=$APK"
          test -f "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/DogKey-original-ui-debug.apk
          ls -lh artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DogKey-original-ui-debug.apk
          path: artifacts/DogKey-original-ui-debug.apk
          retention-days: 30
          if-no-files-found: error
